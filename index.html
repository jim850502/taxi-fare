<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="免安裝的台灣計程車車資判斷工具">
  <link rel="manifest" href="manifest.webmanifest">
  <title>車資判斷助手</title>
  <style>
    :root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--yellow:#fbbf24;--green:#059669;--red:#dc2626;--blue:#2563eb}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#fff7d6 0,#f3f4f6 38%);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
    main{width:min(720px,100%);margin:auto;padding:18px 14px 48px}.hero{display:flex;gap:12px;align-items:center;margin:4px 2px 16px}.logo{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:#111827;font-size:27px}.hero h1{font-size:24px;margin:0}.hero p{margin:3px 0 0;color:var(--muted);font-size:14px}
    .card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 12px 35px rgba(17,24,39,.06)}
    label{font-size:13px;font-weight:700;display:block;margin:12px 0 6px}input,select,button{width:100%;min-height:48px;border-radius:12px;border:1px solid #d1d5db;background:white;padding:10px 12px;font:inherit;color:inherit}input:focus,select:focus{outline:3px solid #fde68a;border-color:#f59e0b}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.address{display:grid;grid-template-columns:1fr auto;gap:8px}.address button{width:50px;padding:0;font-size:20px}
    button{cursor:pointer;font-weight:800}.primary{margin-top:16px;background:#111827;color:white;border:0}.secondary{background:#fff7d6;border-color:#fbbf24}.status{min-height:22px;margin:10px 2px 0;font-size:14px;color:var(--muted)}
    .results{display:none}.results.show{display:block}.route{font-size:14px;color:var(--muted);margin-bottom:12px}.big-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f9fafb;border:1px solid var(--line);border-radius:15px;padding:13px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:24px;margin-top:3px}.metric.accent{background:#fffbeb;border-color:#fde68a}.metric.money{background:#ecfdf5;border-color:#a7f3d0}.detail{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.detail .metric strong{font-size:17px}.verdict{border-radius:14px;padding:12px 14px;margin-top:10px;font-weight:800}.good{background:#d1fae5;color:#065f46}.mid{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}
    details{margin-top:10px}summary{cursor:pointer;font-weight:800}.foot{color:var(--muted);font-size:12px;line-height:1.55;text-align:center;margin-top:16px}.switch{display:flex;align-items:center;gap:8px;margin-top:12px}.switch input{width:20px;min-height:20px}.switch label{margin:0;font-weight:600}
    dialog{width:min(600px,calc(100% - 24px));border:0;border-radius:20px;padding:0;box-shadow:0 24px 80px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(17,24,39,.55)}.picker{padding:18px}.picker h2{font-size:19px;margin:0 0 6px}.picker p{color:var(--muted);font-size:14px;margin:0 0 12px}.choices{display:grid;gap:8px}.choice{text-align:left;height:auto;min-height:54px;font-weight:650;line-height:1.4}.choice small{display:block;color:var(--muted);font-weight:500}.cancel{margin-top:12px;background:#f3f4f6}
    @media(max-width:500px){.row,.big-grid{grid-template-columns:1fr}.detail{grid-template-columns:1fr 1fr}.hero h1{font-size:22px}}
  </style>
</head>
<body>
<main>
  <header class="hero"><div class="logo">🚕</div><div><h1>車資判斷助手</h1><p>輸入路線，快速判斷這趟值不值得接</p></div></header>

  <section class="card">
    <label for="from">起點</label>
    <div class="address"><input id="from" autocomplete="street-address" placeholder="例如：三重龍濱路"><button id="locate" title="使用目前位置" aria-label="使用目前位置">📍</button></div>
    <label for="to">終點</label><input id="to" autocomplete="street-address" placeholder="例如：桃機2、台北車站">
    <div class="row">
      <div><label for="pickup">接客距離（公里）</label><input id="pickup" type="number" min="0" step="0.1" value="0"></div>
      <div><label for="wait">停等時間（分鐘）</label><input id="wait" type="number" min="0" step="1" value="0"></div>
    </div>
    <div class="row">
      <div><label for="empty">空返距離（公里）</label><input id="empty" type="number" min="0" step="0.1" value="0"></div>
      <div><label for="surge">平台加成（元）</label><input id="surge" type="number" min="0" step="1" value="0"></div>
    </div>
    <div class="row">
      <div><label for="toll">過路費／其他（元）</label><input id="toll" type="number" min="0" step="1" value="0"></div>
      <div><label for="efficiency">油耗（km/L）</label><input id="efficiency" type="number" min="1" step="0.1" value="18"></div>
    </div>
    <label for="fuelPrice">油價（元/L）</label><input id="fuelPrice" type="number" min="0" step="0.1" value="28">
    <div class="switch"><input id="night" type="checkbox"><label for="night">夜間 23:00–06:00（加收 $20）</label></div>
    <button class="primary" id="routeBtn">估算路線與車資</button>
    <div class="status" id="status" role="status"></div>
  </section>

  <section class="card">
    <details><summary>無法取得路線？改用手動輸入</summary>
      <div class="row"><div><label for="km">行程距離（公里）</label><input id="km" type="number" min="0" step="0.1" placeholder="例如 13.7"></div><div><label for="mins">行車時間（分鐘）</label><input id="mins" type="number" min="0" step="1" placeholder="例如 24"></div></div>
      <button class="secondary" id="manualBtn">用手動數字計算</button>
    </details>
  </section>

  <section class="card results" id="results">
    <div class="route" id="routeText"></div>
    <div class="big-grid">
      <div class="metric accent"><span>雙北跳表預估</span><strong id="meterFare">$0</strong></div>
      <div class="metric money"><span>平台司機預估實拿</span><strong id="driverFare">$0</strong></div>
    </div>
    <div class="detail">
      <div class="metric"><span>平台行程費用</span><strong id="platformFare">$0</strong></div>
      <div class="metric"><span>司機收入／總公里</span><strong id="perKm">$0</strong></div>
      <div class="metric"><span>預估時薪</span><strong id="hourly">$0</strong></div>
      <div class="metric"><span>總行駛距離</span><strong id="totalKm">0 km</strong></div>
      <div class="metric"><span>預估油費</span><strong id="fuelCost">$0</strong></div>
      <div class="metric"><span>扣油與過路費後</span><strong id="netIncome">$0</strong></div>
    </div>
    <div class="verdict" id="verdict"></div>
    <button class="secondary" id="analysisBtn">更新接單分析</button>
  </section>

  <p class="foot">跳表採雙北基一般費率：1.25 公里 $85、續程每 200 公尺 $5、低速停等每 60 秒 $5；實際金額依跳表、路況、加成與平台報價為準。路線資料 © OpenStreetMap contributors，routing by OSRM。</p>
</main>
<dialog id="addressDialog"><div class="picker"><h2 id="pickerTitle">選擇地址</h2><p>找到多個可能的位置，請選擇正確的一個：</p><div class="choices" id="addressChoices"></div><button class="cancel" id="pickerCancel">取消</button></div></dialog>
<script>
const $=id=>document.getElementById(id);
const aliases={"桃機1":"桃園國際機場第一航廈","桃機2":"桃園國際機場第二航廈","桃機":"桃園國際機場","北車":"台北車站","松機":"台北松山機場"};
const districtCity={"中正區":"臺北市","大同區":"臺北市","中山區":"臺北市","松山區":"臺北市","大安區":"臺北市","萬華區":"臺北市","信義區":"臺北市","士林區":"臺北市","北投區":"臺北市","內湖區":"臺北市","南港區":"臺北市","文山區":"臺北市","板橋區":"新北市","三重區":"新北市","中和區":"新北市","永和區":"新北市","新莊區":"新北市","新店區":"新北市","土城區":"新北市","蘆洲區":"新北市","樹林區":"新北市","汐止區":"新北市","鶯歌區":"新北市","三峽區":"新北市","淡水區":"新北市","瑞芳區":"新北市","五股區":"新北市","泰山區":"新北市","林口區":"新北市","深坑區":"新北市","石碇區":"新北市","坪林區":"新北市","三芝區":"新北市","石門區":"新北市","八里區":"新北市","平溪區":"新北市","雙溪區":"新北市","貢寮區":"新北市","金山區":"新北市","萬里區":"新北市","烏來區":"新北市","桃園區":"桃園市","中壢區":"桃園市","平鎮區":"桃園市","八德區":"桃園市","楊梅區":"桃園市","蘆竹區":"桃園市","龜山區":"桃園市","龍潭區":"桃園市","大溪區":"桃園市","大園區":"桃園市","觀音區":"桃園市","新屋區":"桃園市","復興區":"桃園市"};
const money=n=>`$${Math.max(0,Math.round(n)).toLocaleString('zh-TW')}`;
function expandAddress(v){let raw=v.trim(),key=raw.toLowerCase().replace(/\s+/g,'');let terminal=key.match(/^(?:桃機|桃園機場|桃園國際機場)(?:t)?([12])$/);if(/^(?:桃機|桃園機場)(?:一航|第一航廈)$/.test(key))terminal=[key,'1'];if(/^(?:桃機|桃園機場)(?:二航|第二航廈)$/.test(key))terminal=[key,'2'];let s=terminal?`桃園國際機場第${terminal[1]==='1'?'一':'二'}航廈`:(aliases[raw]||raw);if(!/[縣市]/.test(s.slice(0,4))){const district=Object.keys(districtCity).find(d=>s.includes(d));if(district)s=districtCity[district]+s}return s}
function chooseAddress(query,items){return new Promise((resolve,reject)=>{const dialog=$('addressDialog'),box=$('addressChoices');$('pickerTitle').textContent=`「${query}」是哪一個？`;box.replaceChildren();items.forEach(item=>{const b=document.createElement('button');b.className='choice';b.textContent=item.name;b.onclick=()=>{dialog.close();resolve(item)};box.appendChild(b)});$('pickerCancel').onclick=()=>{dialog.close();reject(new Error('已取消地址選擇'))};dialog.oncancel=e=>{e.preventDefault();dialog.close();reject(new Error('已取消地址選擇'))};dialog.showModal()})}
async function geocode(q){
  const placeKey=q.trim().toLowerCase().replace(/\s+/g,'');
  if(/^(?:桃機|桃園機場|桃園國際機場)(?:t?2|二航|第二航廈)$/.test(placeKey))return{lat:25.07703,lon:121.232,name:'桃園國際機場第二航廈'};
  if(/^(?:桃機|桃園機場|桃園國際機場)(?:t?1|一航|第一航廈)$/.test(placeKey))return{lat:25.080831,lon:121.2376,name:'桃園國際機場第一航廈'};
  if(/^(?:桃機|桃園機場|桃園國際機場)$/.test(placeKey))return{lat:25.079,lon:121.2348,name:'桃園國際機場'};
  const key='geo2:'+q, cached=localStorage.getItem(key); if(cached)return JSON.parse(cached);
  const exact=expandAddress(q), broad=exact.replace(/\d+(?:之\d+)?號/g,'').replace(/\s+/g,' ').trim();
  async function search(text){const url=`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&countrycodes=tw&q=${encodeURIComponent(text)}`;const res=await fetch(url);if(!res.ok)throw new Error('地址查詢服務暫時無法使用');return res.json()}
  async function arcgis(text){const url=`https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&forStorage=false&outSR=4326&maxLocations=6&countryCode=TWN&SingleLine=${encodeURIComponent(text)}`;const res=await fetch(url);if(!res.ok)return[];const d=await res.json();return(d.candidates||[]).filter(x=>x.score>=65).map(x=>({lat:+x.location.y,lon:+x.location.x,display_name:`${x.address}（相符度 ${Math.round(x.score)}%）`}))}
  async function structured(){const district=Object.keys(districtCity).find(d=>exact.includes(d));if(!district)return[];const street=exact.replace(districtCity[district],'').replace(district,'');const url=`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&countrycodes=tw&street=${encodeURIComponent(street)}&city=${encodeURIComponent(district)}&county=${encodeURIComponent(districtCity[district])}`;const res=await fetch(url);if(!res.ok)throw new Error('地址查詢服務暫時無法使用');return res.json()}
  let data=await structured(), approximate=false;
  if(!data.length){await new Promise(r=>setTimeout(r,1050));data=await search(exact)}
  if(!data.length&&broad!==exact){await new Promise(r=>setTimeout(r,1050));data=await search(broad);approximate=true}
  if(!data.length){data=await arcgis(exact);approximate=true}
  if(!data.length)throw new Error(`找不到地址：${q}（請至少補上縣市或行政區）`);
  const items=data.map(x=>({lat:+x.lat,lon:+x.lon,name:(approximate?'約在此處：':'')+x.display_name}));
  const out=(items.length===1&&!approximate)?items[0]:await chooseAddress(q,items);localStorage.setItem(key,JSON.stringify(out));return out;
}
async function route(a,b){const url=`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false&alternatives=false&steps=false`;const res=await fetch(url);if(!res.ok)throw new Error('路線服務暫時無法使用');const d=await res.json();if(d.code!=='Ok'||!d.routes?.length)throw new Error('找不到可行車路線');return {km:d.routes[0].distance/1000,mins:d.routes[0].duration/60}}
function calculate(km,mins,label){
  const wait=Math.max(0,+$('wait').value||0), pickup=Math.max(0,+$('pickup').value||0), empty=Math.max(0,+$('empty').value||0), surge=Math.max(0,+$('surge').value||0), toll=Math.max(0,+$('toll').value||0), efficiency=Math.max(1,+$('efficiency').value||18), fuelPrice=Math.max(0,+$('fuelPrice').value||28), night=$('night').checked;
  const distanceFare=85+Math.max(0,Math.ceil((km-1.25)/.2))*5, waitFare=Math.ceil(wait)*5, nightFare=night?20:0, meter=distanceFare+waitFare+nightFare;
  // 依使用者提供的短、中、長程實際司機收入樣本直接回歸，避免固定 25% 抽成造成長程低估。
  const baseDriver=Math.max(64,40.039+18.727*km+2.280*mins), driver=baseDriver+surge*.75+toll+nightFare;
  const platform=baseDriver/.75+surge+toll+nightFare, totalKm=km+pickup+empty, totalMins=mins+(pickup+empty)/25*60, fuelCost=totalKm/efficiency*fuelPrice, net=driver-fuelCost-toll;
  const perKm=net/Math.max(totalKm,.1), hourly=net/Math.max(totalMins/60,.1);
  $('meterFare').textContent=money(meter);$('platformFare').textContent=money(platform);$('driverFare').textContent=money(driver);$('perKm').textContent=money(perKm);$('hourly').textContent=money(hourly);$('totalKm').textContent=`${totalKm.toFixed(1)} km`;$('fuelCost').textContent=money(fuelCost);$('netIncome').textContent=money(net);
  $('meterFare').title=`純里程 ${money(distanceFare)}＋停等 ${money(waitFare)}＋夜間 ${money(nightFare)}`;
  $('routeText').textContent=`${label}｜${km.toFixed(2)} 公里・約 ${Math.round(mins)} 分鐘${pickup?`・接客 ${pickup.toFixed(1)} 公里`:''}${empty?`・空返 ${empty.toFixed(1)} 公里`:''}`;
  const score=perKm>=20&&hourly>=450?'good':perKm>=15&&hourly>=320?'mid':'bad';
  $('verdict').className='verdict '+score;$('verdict').textContent=score==='good'?'值得接：扣除油費後的單位收入與時薪都不錯':score==='mid'?'普通：請再考慮目的地、空返與下一單機會':'不建議：接客、空返或燃油成本使淨收入偏低';
  $('results').classList.add('show');$('results').scrollIntoView({behavior:'smooth',block:'start'});
}
$('routeBtn').addEventListener('click',async()=>{const f=$('from').value.trim(),t=$('to').value.trim();$('results').classList.remove('show');if(!f||!t){$('status').textContent='請輸入起點與終點';return}try{$('routeBtn').disabled=true;$('status').textContent='正在判斷起點…';const a=await geocode(f);$('status').textContent='正在判斷終點…';await new Promise(r=>setTimeout(r,1050));const b=await geocode(t);$('status').textContent='正在計算道路路線…';const r=await route(a,b);$('km').value=r.km.toFixed(1);$('mins').value=Math.round(r.mins);calculate(r.km,r.mins,`${f} → ${t}`);$('status').textContent='路線估算完成'}catch(e){$('status').textContent=`自動路線失敗：${e.message}。可改用手動輸入。`}finally{$('routeBtn').disabled=false}});
$('manualBtn').addEventListener('click',()=>{const km=+$('km').value,mins=+$('mins').value;if(!(km>0)||!(mins>0)){alert('請輸入有效的距離與時間');return}calculate(km,mins,'手動估算')});
$('analysisBtn').addEventListener('click',()=>{const km=+$('km').value,mins=+$('mins').value;if(km>0&&mins>0)calculate(km,mins,$('routeText').textContent.split('｜')[0]||'更新分析')});
$('locate').addEventListener('click',()=>{if(!navigator.geolocation){$('status').textContent='此瀏覽器不支援定位';return}$('status').textContent='正在取得目前位置…';navigator.geolocation.getCurrentPosition(p=>{$('from').value=`${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}`;$('from').dataset.coords=`${p.coords.longitude},${p.coords.latitude}`;$('status').textContent='已取得目前位置'},e=>$('status').textContent='無法取得定位，請確認瀏覽器定位權限')});
// 若起點是 GPS 座標，直接使用，避免送出反查請求。
const oldGeocode=geocode;geocode=async function(q){const m=q.match(/^(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)$/);return m?{lat:+m[1],lon:+m[2],name:'目前位置'}:oldGeocode(q)};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
